# Nome do sistema que roda no navegador
spring.application.name=pdv

# Remove o aviso chato do console que a gente já tinha resolvido
spring.jpa.open-in-view=false

# Sessão de login dura 12h — cobre o turno inteiro sem deslogar o operador
server.servlet.session.timeout=12h

# 🗄️ CONFIGURAÇÃO DO BANCO DE DADOS PERSISTENTE
# O "~" é a pasta do usuário do Windows (C:\Users\<nome>). Caminho FIXO:
# não importa de onde o sistema for iniciado, o banco é sempre o mesmo.
# (Antes era ./dados relativo, o que criava bancos duplicados.)
spring.datasource.url=jdbc:h2:file:~/UnickaPDV/dados/unickadb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ⚙️ O PULO DO GATO PARA NÃO APAGAR NADA:
# O valor "update" avisa ao Java: "Se a tabela já existir, NÃO APAGUE, apenas use ela e insira novos dados".
spring.jpa.hibernate.ddl-auto=update

# 🏪 DADOS DA LOJA (o que aparece no cabeçalho do cupom de venda)
# O nome, o CNPJ e o endereço reais NÃO ficam aqui — assim o código pode ir para
# o GitHub sem expor informação da loja. Eles vêm do arquivo
# "unicka-local.properties", na raiz do projeto, que está fora do Git.
# Para criar o seu, use o modelo: unicka-local.properties.exemplo
# O "optional:" faz o sistema iniciar normalmente mesmo se o arquivo não existir
# (nesse caso o cupom sai só sem CNPJ e sem endereço).
spring.config.import=optional:file:./unicka-local.properties
